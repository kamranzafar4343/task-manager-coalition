services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    image: task-manager-php83-app
    container_name: task_manager_app

    restart: unless-stopped

    working_dir: /var/www/html

    volumes:
      - ./:/var/www/html

    networks:
      - task-manager-net

    depends_on:
      - db


  nginx:
    image: nginx:alpine
    container_name: task_manager_nginx

    restart: unless-stopped

    ports:
      - "8000:80"

    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf

    networks:
      - task-manager-net

    depends_on:
      - app


  db:
    image: mysql:8.0
    container_name: task_manager_db

    restart: unless-stopped

    environment:
      MYSQL_DATABASE: task_manager
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret

    ports:
      - "3309:3306"

    volumes:
      - dbdata:/var/lib/mysql

    networks:
      - task-manager-net


  phpmyadmin:
    image: phpmyadmin:latest
    container_name: task_manager_phpmyadmin

    restart: unless-stopped

    environment:
      PMA_HOST: db
      PMA_PORT: 3306

    ports:
      - "8090:80"

    networks:
      - task-manager-net

    depends_on:
      - db


networks:
  task-manager-net:
    driver: bridge


volumes:
  dbdata:
    driver: local